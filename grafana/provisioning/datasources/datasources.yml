# Grafana loads this automatically when GF_PATHS_PROVISIONING points here.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus-smarthome
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "5s"
      httpMethod: POST
